version: "3.1"
nlu:
- intent: avaliar
  examples: |
    - Quero avaliar um livro
    - Gostaria de dar uma nota para um livro
    - Quero registrar minha avaliação de um livro
    - Posso avaliar um livro?
    - Vou avaliar um livro agora
    - Adicionar uma avaliação para um livro
    - Quero dar uma nota para um livro que li
    - Registrar minha opinião sobre um livro
    - Avaliar um livro que acabei de ler
    - Posso adicionar uma resenha de um livro?
    - Quero dar minha nota para um livro
    - Quero dar uma nota para um livro
    - quero avaliar um livro
- intent: informar_livro
  examples: |
    - O livro é [O Senhor dos Anéis](livro)
    - Quero avaliar [Harry Potter](livro)
    - [1984](livro)
    - [O Pequeno Príncipe](livro)
    - [Dom Quixote](livro)
    - Quero dar minha opinião sobre [Moby Dick](livro)
    - Estou falando sobre [Guerra e Paz](livro)
    - [O Hobbit](livro)
    - [Harry Potter][{"entity": "livro"}, {"entity": "livro"}]
- intent: informar_nota
  examples: |
    - Eu dou [5](nota) estrelas
    - Eu dou [4](nota) estrelas
    - Minha nota é [3](nota)
    - Dou [2](nota) estrelas para o livro
    - Avalio com [1](nota) estrela
    - Minha avaliação é [5](nota)
    - Dou [3](nota) estrelas
    - Minha nota para o livro é [4](nota)
    - Avalio o livro com [2](nota) estrelas
    - Dou [1](nota) estrela
    - Minha avaliação é [4](nota) estrelas
    - [4.5](nota) estrelas
- intent: confirmar_resenha
  examples: |
    - Sim
- intent: negar_resenha
  examples: |
    - Não
- intent: informar_resenha
  examples: |
    - Gostei muito desse livro, a história é envolvente e cheia de reviravoltas.
    - Esse livro mudou minha vida! A escrita é cativante e a trama surpreendente.
    - Achei meio cansativo, os personagens não me prenderam tanto.
    - Uma leitura incrível! Recomendo para todos que gostam de fantasia.
    - A narrativa foi um pouco confusa para mim, mas o final compensou.
    - Não gostei muito, esperava algo diferente.
    - Um dos melhores livros que já li! A escrita do autor é fantástica.
    - Esse livro é emocionante, cheio de reflexões sobre a vida.
- intent: visualizar_avaliacoes
  examples: |
    - Quero ver as avaliações do meus livros 
    - Quero ver as notas que dei para os livros
    - Quero ver as resenhas que escrevi
    - Quero ver as avaliações que fiz
    - Quero ver as notas que dei
- intent: dizer_ola_mundo
  examples: |
    - Olá, mundo!
    - oi mundo
    - olá mundo